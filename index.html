<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Kho (bản mới)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 21V8l9-5 9 5v13M7 21v-8h10v8' fill='none' stroke='%230f766e' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14211f;--mu:#5d6d6a;--ln:#dfe7e5;--pr:#0f766e;--prl:#e3f2ef;--err:#b42318;--errl:#fdecea;--ok:#15803d;--okl:#e7f6ec;--wa:#b45309;--wal:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--card:#17201e;--tx:#e6eeec;--mu:#9aaba7;--ln:#2a3633;--pr:#2dd4bf;--prl:#123a35;--err:#f87171;--errl:#3a1717;--ok:#4ade80;--okl:#13301d;--wa:#fbbf24;--wal:#3a2b10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font-size:17px;margin:0;color:var(--pr)}
header .who{margin-left:auto;color:var(--mu);font-size:13px;text-align:right}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--ln);overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mu);white-space:nowrap}
nav button.on{background:var(--prl);color:var(--pr);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 180px}
label{display:block;font-size:13px;color:var(--mu)}
label input,label select,label textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:9px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}
input[readonly]{background:var(--bg)}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:9px 16px;cursor:pointer;min-height:40px}
.btn.pr{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.pr{color:#06201d}}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 18px;cursor:pointer}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201d}}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--prl)}
.tbl{overflow:auto;max-height:65vh;border:1px solid var(--ln);border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--ln);border-radius:20px;padding:4px 12px;background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--prl);border-color:var(--pr);color:var(--pr)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;white-space:nowrap}
.t-ok{background:var(--okl);color:var(--ok)}.t-err{background:var(--errl);color:var(--err)}.t-wa{background:var(--wal);color:var(--wa)}.t-mu{background:var(--bg);color:var(--mu)}
.neg{color:var(--err);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}
.msg.err{background:var(--errl);color:var(--err)}.msg.ok{background:var(--okl);color:var(--ok)}.msg.wa{background:var(--wal);color:var(--wa)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
#toast.on{opacity:1}
.login{max-width:380px;margin:12vh auto}
.login h1{color:var(--pr);margin:0 0 4px}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1 1 140px;background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.side{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:10}
.side>div{width:min(640px,100%);height:100%;overflow:auto;background:var(--card);padding:18px}
.hide{display:none!important}
@media (max-width:640px){main{padding:10px}.card{padding:12px}th,td{padding:7px 6px}.hide-m{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
